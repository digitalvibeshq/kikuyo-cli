name: Linear Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag metadata
        id: meta
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          prev_tag="$(git tag --merged HEAD --sort=-creatordate | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | grep -vxF "$tag" | head -n 1 || true)"
          echo "version=cli/$ver" >> "$GITHUB_OUTPUT"
          echo "base_ref=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Sync Linear release
        uses: linear/linear-release-action@dd4fc407f860b9460d2cf0b3fb1edd8985cf443f # v0.18.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          base_ref: ${{ steps.meta.outputs.base_ref }}
